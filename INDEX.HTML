
<!DOCTYPE html>
<html>
<head>
<title>Car Racing Game</title>
<style>
body {
  background: #222;
  color: white;
  text-align: center;
  font-family: Arial;
}
canvas {
  background: #555;
  border: 4px solid white;
}
button {
  padding: 12px 25px;
  margin: 8px;
  font-size: 20px;
}
</style>
</head>
<body>

<h1>🏎️ Car Racing Game</h1>
<h2>Score: <span id="score">0</span></h2>
<canvas id="game" width="300" height="450"></canvas>
<br>
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>
<button onclick="restart()">Restart</button>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let car = 130;
let enemy = 50;
let score = 0;
let speed = 4;
let over = false;

function draw() {
  ctx.clearRect(0,0,300,450);

  ctx.fillStyle = "#333";
  ctx.fillRect(40,0,220,450);

  ctx.strokeStyle = "white";
  ctx.setLineDash([25,20]);
  ctx.beginPath();
  ctx.moveTo(150,0);
  ctx.lineTo(150,450);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = "red";
  ctx.fillRect(enemy, enemy === -100 ? 0 : 40, 40, 65);

  ctx.fillStyle = "cyan";
  ctx.fillRect(car,350,40,70);

  if (enemy > 450) {
    enemy = Math.random()*180+40;
    score++;
    speed += 0.2;
    document.getElementById("score").innerText=score;
  }

  enemy += speed;

  if(enemy+65 > 350 && enemy < 420 &&
     car < enemy+40 && car+40 > enemy) {
    over=true;
  }

  if(!over) requestAnimationFrame(draw);
  else {
    ctx.fillStyle="yellow";
    ctx.font="30px Arial";
    ctx.fillText("GAME OVER!",55,220);
  }
}

function move(dir) {
  if(!over) car=Math.max(45,Math.min(215,car+dir*30));
}

function restart() {
  car=130;
  enemy=-100;
  score=0;
  speed=4;
  over=false;
  document.getElementById("score").innerText=0;
  draw();
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") move(-1);
  if(e.key==="ArrowRight") move(1);
});

draw();
</script>
</body>
</html>
